# Prose rules from yldio/vale-yld. `mise run lint:prose` downloads the
# pinned release into .vale/styles and checks its signature first.
StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = YLD

# This skill quotes the banned words and phrases on purpose. It teaches
# a model to remove them. The glob also matches its single-skill copy.
[plugins/*/skills/unslop/SKILL.md]
BasedOnStyles =

# Citations keep the exact titles of the cited works.
[plugins/*/skills/*/references/REFERENCES.md]
BasedOnStyles =
