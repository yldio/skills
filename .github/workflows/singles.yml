name: singles

# Each single-skill plugin holds a copy of a skill from its team plugin.
# Fail when a copy is out of date, so the two never drift apart.
on:
  pull_request:
    paths:
      - plugins/**
      - .mise/tasks/singles
      - .github/workflows/singles.yml
  push:
    branches: [main]
    paths:
      - plugins/**
      - .mise/tasks/singles
      - .github/workflows/singles.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: singles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  singles:
    name: singles
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # The task needs no tools.
      MISE_TASK_RUN_AUTO_INSTALL: "false"

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.18
          # SHA-256 of the linux-x64 mise binary, from SHASUMS256.txt in the release.
          sha256: d24fe0bf7e613824ad99f7b8dac3f2b381a37b9f75f84dd250855217095a8de4
          install: false

      - name: Check the single-skill copies
        run: mise run singles --check
